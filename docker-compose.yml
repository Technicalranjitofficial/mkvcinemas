services:
  # ── Next.js Application ────────────────────────────────────────────────────
  # Uses MongoDB Atlas — no local MongoDB dependency needed
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mkvcinemas_app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TMDB_API_KEY: ${TMDB_API_KEY}
    networks:
      - mkvcinemas

  # ── OTT Daily Import Worker ───────────────────────────────────────────────
  # Fetches latest Netflix/Prime/Disney+/etc. titles every 24h and upserts DB
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: mkvcinemas_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TMDB_API_KEY: ${TMDB_API_KEY}
    networks:
      - mkvcinemas

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: mkvcinemas_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - mkvcinemas

volumes:
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local

networks:
  mkvcinemas:
    driver: bridge
