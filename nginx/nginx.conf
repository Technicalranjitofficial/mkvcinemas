user  nginx;
worker_processes  auto;           # one worker per CPU core
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" cache=$upstream_cache_status';
    access_log  /var/log/nginx/access.log  main;

    # ── Core Performance ─────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    server_tokens      off;
    keepalive_timeout  75s;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 20m;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;          # good balance of CPU vs compression ratio
    gzip_min_length   256;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Proxy Cache ───────────────────────────────────────────────────────────
    # Stores rendered HTML on disk so repeat requests skip Next.js entirely.
    # 200 MB disk limit; inactive items evicted after 1 hour.
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=NEXTJS:20m
        max_size=200m
        inactive=60m
        use_temp_path=off;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=general:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=admin:10m    rate=5r/s;
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

    # ── Upstream (Next.js container) ─────────────────────────────────────────
    upstream nextjs_app {
        server  app:3000;
        keepalive 64;             # reuse connections to Next.js
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen      80;
        listen      [::]:80;
        server_name _;

        # Allow Certbot ACME challenge through before redirect
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS Server ─────────────────────────────────────────────────────
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2       on;
        server_name YOUR_DOMAIN.COM;          # ← replace with your domain

        # ── TLS ──────────────────────────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.COM/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.COM/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN.COM/chain.pem;

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout    5s;

        # ── Security Headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=()" always;

        # Common proxy headers (shared by all locations)
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;

        # ── Next.js Static Assets (JS/CSS build artifacts) ─────────────────
        # Immutable: content-hashed filenames → cache forever, no revalidation
        location /_next/static/ {
            proxy_pass          http://nextjs_app;
            proxy_cache         NEXTJS;
            proxy_cache_valid   200 365d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header          Cache-Control "public, max-age=31536000, immutable";
            add_header          X-Cache-Status $upstream_cache_status;
        }

        # ── Next.js Image Optimisation endpoint ──────────────────────────────
        # Nginx caches the already-optimised AVIF/WebP for 7 days
        location /_next/image {
            proxy_pass          http://nextjs_app;
            proxy_cache         NEXTJS;
            proxy_cache_valid   200 7d;
            proxy_cache_key     "$scheme$host$request_uri";
            proxy_cache_use_stale error timeout updating http_500;
            add_header          Cache-Control "public, max-age=604800, stale-while-revalidate=2592000";
            add_header          X-Cache-Status $upstream_cache_status;
        }

        # ── Public folder (posters, icons, etc.) ─────────────────────────────
        location /public/ {
            proxy_pass        http://nextjs_app;
            proxy_cache       NEXTJS;
            proxy_cache_valid 200 1d;
            add_header        Cache-Control "public, max-age=86400";
        }

        # ── Admin area – NO cache, stricter rate limit ────────────────────────
        location /admin {
            limit_req        zone=admin burst=10 nodelay;
            limit_conn       conn_limit 20;
            proxy_pass       http://nextjs_app;
            proxy_cache_bypass 1;
            proxy_no_cache     1;
        }

        # ── Auth (login/logout) – NO cache ────────────────────────────────────
        location /api/auth/ {
            proxy_pass       http://nextjs_app;
            proxy_cache_bypass 1;
            proxy_no_cache     1;
        }

        # ── API routes – NO cache, general rate limit ─────────────────────────
        location /api/ {
            limit_req        zone=general burst=20 nodelay;
            proxy_pass       http://nextjs_app;
            proxy_cache_bypass 1;
            proxy_no_cache     1;
        }

        # ── All other pages (movie pages, category, home) ─────────────────────
        # Short 60-second cache keeps the site fast under load.
        # Cache is bypassed when the browser sends Cache-Control: no-cache
        # (e.g. Ctrl+F5 hard reload).
        location / {
            limit_req         zone=general burst=30 nodelay;
            limit_conn        conn_limit 50;
            proxy_pass        http://nextjs_app;
            proxy_cache       NEXTJS;
            proxy_cache_valid 200 60s;
            proxy_cache_valid 404 10s;
            proxy_cache_key   "$scheme$host$request_uri$is_args$args";
            proxy_cache_bypass $http_cache_control;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock  on;                 # collapse simultaneous cache misses
            add_header        X-Cache-Status $upstream_cache_status;
        }
    }
}
